<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>우리태권도 대회관리</title>
<style>body{margin:0;background:#f0f5fb;color:#172b49;font:17px/1.7 system-ui,sans-serif}main{max-width:620px;margin:12vh auto;padding:32px;background:white;border-radius:20px;box-shadow:0 12px 45px #1232}h1{line-height:1.3}a{display:inline-block;background:#1749ad;color:white;padding:14px 24px;border-radius:10px;text-decoration:none}small{display:block;color:#526178}#error{color:#a52828} @media(max-width:680px){main{margin:24px;padding:24px}}</style></head>
<body><style>[hidden]{display:none!important}</style><main><small>WOORI TAEKWONDO · 지도진 전용</small><h1>우리태권도<br>대회관리</h1><p>순위 · 학부모 참석 · 귀가 현황을 함께 관리합니다.</p><a id="open" hidden>Google 계정으로 관리화면 열기</a><p id="error" role="status"></p><small>관리자가 등록한 Google 계정으로 로그인하세요.<br>이 공개 페이지에는 참가자 명단과 인증 정보가 저장되지 않습니다.</small></main>
<script>
'use strict';
// 웹 앱 배포 후 /exec 주소만 입력하세요. 비밀번호나 토큰을 넣지 마세요.
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbygel5uux128U66eLWnCPmzhLav_Dp6DaiiDhgynhJXxwy0U3gWt15bjNYlZUk13_lF0A/exec';
try {
 const url = new URL(WEB_APP_URL);
 if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' || !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname) || url.search || url.hash) throw Error();
 const a = document.getElementById('open'); a.href=url.href; a.hidden=false;
} catch (_) {document.getElementById('error').textContent='관리자가 Apps Script 배포 주소를 설정해야 합니다. ZIP의 설정안내를 확인하세요.';}
</script></body></html>
